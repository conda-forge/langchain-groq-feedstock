schema_version: 1

context:
  name: langchain-groq
  version: 1.2.1

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/langchain_groq-${{ version }}.tar.gz
  sha256: 0ce10a14be647bf7d1c1c66348c8d7124a8ab6857cc6d65e4984fed7b2215752

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }},<4.0
    - langchain-core >=1.8.2,<2.0.0
    - groq >=0.30.0
tests:
  - python:
      imports:
        - langchain_groq
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: An integration package connecting Groq and LangChain
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/langchain-ai/langchain

extra:
  recipe-maintainers:
    - jan-janssen
